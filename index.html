<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Mercados</title>
<link rel="manifest" href="/api/manifest">
<meta name="theme-color" content="#060910">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercados BM">
<link rel="apple-touch-icon" href="/public/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html{font-size:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060910;--panel:#0b0f18;--panel2:#0f1520;--border:#141c2e;--border2:#1a2440;
  --accent:#00c896;--blue:#3d8ef0;--amber:#f0a03d;--red:#e05252;--text:#c8d4e8;--muted:#3d5070;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
[data-theme="bloomberg"]{
  --bg:#000;--panel:#111;--panel2:#0a0a0a;--border:#222;--border2:#333;
  --accent:#ff7d00;--blue:#4488ff;--amber:#ffaa00;--red:#ff3333;--text:#ff7d00;--muted:#555;
}
[data-theme="meridian"]{
  --bg:#f0f4f8;--panel:#fff;--panel2:#eef2f8;--border:#d0dce8;--border2:#b0c4d8;
  --accent:#1a7a50;--blue:#1a3a6b;--amber:#8a6200;--red:#c0392b;--text:#1a2d4a;--muted:#5a7a9a;
}
[data-theme="reuters"]{
  --bg:#f5f5f5;--panel:#fff;--panel2:#fafafa;--border:#e0e0e0;--border2:#ccc;
  --accent:#00aa44;--blue:#1a6aff;--amber:#e65c00;--red:#cc2233;--text:#1a1a1a;--muted:#999;
}
/* theme selector */
.theme-btn{position:fixed;top:10px;right:10px;z-index:1000;background:var(--panel2);border:1px solid var(--border2);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.theme-btn:hover{color:var(--text);border-color:var(--accent)}
.theme-dropdown{position:fixed;top:44px;right:10px;z-index:1000;background:var(--panel);border:1px solid var(--border2);border-radius:6px;overflow:hidden;display:none;min-width:140px}
.theme-dropdown.open{display:block}
.theme-opt{padding:7px 14px;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted);cursor:pointer;text-transform:uppercase}
.theme-opt:hover{background:var(--panel2);color:var(--text)}
.theme-opt.active{color:var(--accent)}
/* Meridian overrides */
[data-theme="meridian"] body::before{background-image:none}
[data-theme="meridian"] .main{background:var(--border)}
[data-theme="meridian"] .card{box-shadow:0 1px 4px rgba(26,58,107,.08)}
[data-theme="meridian"] .card-head-bar{display:block}
[data-theme="meridian"] .bond-label,[data-theme="meridian"] .section-label{background:#1a3a6b;color:#fff;opacity:1;border-bottom:2px solid #4db8d4}
[data-theme="meridian"] .live-dot{background:#4db8d4;box-shadow:0 0 5px #4db8d4}
[data-theme="meridian"] .ticker-band{background:#0f2a52;border-top:2px solid #4db8d4}
[data-theme="meridian"] .ticker-band::before{background:linear-gradient(90deg,#0f2a52,transparent)}
[data-theme="meridian"] .ticker-band::after{background:linear-gradient(270deg,#0f2a52,transparent)}
[data-theme="meridian"] .ticker-top{background:#4db8d4}
[data-theme="meridian"] .clock{color:#4db8d4}
[data-theme="meridian"] .pf-table th,[data-theme="meridian"] .db-table th,[data-theme="meridian"] .bond-table th,[data-theme="meridian"] .fci-table th{background:#1a3a6b;color:#4db8d4}
[data-theme="meridian"] .row-mer td{background:rgba(26,58,107,.06)!important}
[data-theme="meridian"] .row-mer .pf-bank{color:#1a3a6b}
[data-theme="meridian"] .row-db-mer td{background:rgba(26,58,107,.06)!important}
[data-theme="meridian"] .db-bank.mer{color:#1a3a6b}
[data-theme="meridian"] .rate-val.green{color:#1a7a50}
[data-theme="meridian"] .rate-val.blue{color:#1a3a6b}
[data-theme="meridian"] .rate-val.amber{color:#8a6200}
[data-theme="meridian"] .lici-header{background:#1a3a6b}
[data-theme="meridian"] .lici-title{color:#fff}
[data-theme="meridian"] .lici-cell{background:var(--panel)}
[data-theme="meridian"] .lici-val{color:#1a3a6b}
[data-theme="meridian"] .lici-cell.liq .lici-val{color:#5a7a9a}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,150,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,150,.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
.main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:1.7fr 1.7fr 1.4fr 1.5fr 1.5fr;grid-template-rows:auto 1fr 1fr;gap:1px;background:var(--border);padding:1px;min-height:0}
.card-tf{grid-column:span 1;grid-row:span 2}.card-cer{grid-column:span 1;grid-row:span 2}.card-hd{grid-column:span 1;grid-row:span 2}
.card-lici{grid-column:span 1}.card-pf{grid-column:span 1}.card-db{grid-column:span 1}
.card-fci{grid-column:5;grid-row:1/span 3}
.card{background:var(--panel);display:flex;flex-direction:column;overflow:hidden;min-height:0;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.rate-wrap{display:flex;flex-direction:column;padding:.65rem 1.1rem .2rem;gap:.06rem}
.rate-name{font-family:var(--mono);font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin-bottom:.12rem;opacity:.85}
.rate-val-row{display:flex;align-items:baseline;gap:.6rem}
.rate-val{font-family:var(--mono);font-size:2.1rem;font-weight:700;line-height:1;letter-spacing:-.025em}
.rate-val.green{color:var(--accent)}.rate-val.blue{color:var(--blue)}.rate-val.amber{color:var(--amber)}
.rate-chg{font-family:var(--mono);font-size:1rem;font-weight:600;display:flex;align-items:center;gap:.2rem}
.chg-up{color:var(--accent)}.chg-down{color:var(--red)}
.rate-date{font-family:var(--mono);font-size:.68rem;color:var(--amber);margin-top:.12rem}
.chart-wrap{padding:.1rem 1rem .4rem;flex-shrink:0}
.chart-svg{width:100%;height:44px;display:block}
.bond-label{padding:.4rem .7rem .12rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex-shrink:0;display:flex;align-items:center;gap:.4rem}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 5px var(--accent);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bond-wrap{flex:1;overflow:hidden;min-height:0}
.bond-table{width:100%;border-collapse:collapse;table-layout:fixed}
.bond-table th{font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:right;padding:.3rem .4rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel2);white-space:nowrap;overflow:hidden}
.bond-table th:first-child{text-align:left}
.bond-table td{font-size:.9rem;padding:.36rem .4rem;border-bottom:1px solid rgba(20,28,46,.8);vertical-align:middle;text-align:right;white-space:nowrap;overflow:hidden}
.bond-table tr:last-child td{border-bottom:none}.bond-table tr:hover td{background:rgba(255,255,255,.025)}
.td-tk{font-family:var(--mono);font-weight:700;text-align:left!important}.td-nr{font-family:var(--mono)}
.td-up{color:var(--accent)}.td-dn{color:var(--red)}.td-var{font-family:var(--mono);font-size:.75rem}.td-mt{color:var(--muted);font-size:.75rem}
.section-label{padding:.4rem .7rem .1rem;font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.pf-wrap{flex:1;overflow:hidden;min-height:0}
.pf-table{width:100%;border-collapse:collapse}
.pf-table th{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.32rem .6rem;border-bottom:1px solid var(--border);background:var(--panel2)}
.pf-table th:last-child{text-align:right}
.pf-table td{font-size:.82rem;padding:.36rem .6rem;border-bottom:1px solid rgba(20,28,46,.8)}
.pf-table tr:last-child td{border-bottom:none}
.row-mer td{background:rgba(0,200,150,.04)!important}.row-mer .pf-bank{color:var(--accent);font-weight:600}
.pf-pos{font-family:var(--mono);font-size:.78rem;color:var(--muted);width:26px;text-align:center}.pf-pos.p1{color:var(--accent)}
.pf-tna{font-family:var(--mono);font-size:.92rem;text-align:right;font-weight:600}.pf-tna.best{color:var(--accent)}
.rank-tag{display:inline-flex;align-items:center;gap:.2rem;font-family:var(--mono);font-size:.62rem;padding:.12rem .45rem;border-radius:3px;background:rgba(240,160,61,.1);color:var(--amber);border:1px solid rgba(240,160,61,.2)}
.db-wrap{flex:1;overflow:auto;min-height:0}
.db-table{width:100%;border-collapse:collapse}
.db-table th{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.32rem .6rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel2)}
.db-table th:last-child{text-align:right}
.db-table td{font-size:.85rem;padding:.38rem .6rem;border-bottom:1px solid rgba(20,28,46,.8);vertical-align:middle}
.db-table tr:last-child td{border-bottom:none}.db-table tr:hover td{background:rgba(255,255,255,.02)}
.row-db-best td{background:rgba(0,200,150,.04)!important}.row-db-mer td{background:rgba(61,142,240,.04)!important}
.db-pos{font-family:var(--mono);font-size:.78rem;color:var(--muted);width:26px;text-align:center}.db-pos.p1{color:var(--accent)}
.db-bank{font-size:.92rem;font-weight:500}.db-bank.mer{color:var(--blue)}
.db-venta{font-family:var(--mono);font-size:.92rem;text-align:right;font-weight:600}.db-venta.best{color:var(--accent)}
/* FCI */
.fci-wrap{flex:1;overflow:auto;min-height:0}
.fci-table{width:100%;border-collapse:collapse}
.fci-table th{font-family:var(--mono);font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.32rem .5rem;border-bottom:1px solid var(--border);background:var(--panel2)}
.fci-table td{font-size:.72rem;padding:.34rem .5rem;border-bottom:1px solid rgba(20,28,46,.8);vertical-align:middle}
.fci-table tr:last-child td{border-bottom:none}.fci-table tr:hover td{background:rgba(255,255,255,.02)}
.fci-name{color:var(--text);font-size:.72rem;line-height:1.2}
.fci-tna{font-family:var(--mono);font-size:.85rem;text-align:right;font-weight:600;color:var(--accent);white-space:nowrap}
.fci-fecha{font-family:var(--mono);font-size:.65rem;text-align:right;color:var(--muted);white-space:nowrap}
.lici-instruments{padding:.3rem .9rem;display:flex;flex-wrap:wrap;gap:.3rem;flex-shrink:0;border-top:1px solid var(--border)}
.lici-bottom{padding:.3rem .9rem .4rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.2rem;flex-shrink:0}
.lici-countdown{font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.lici-link{font-family:var(--mono);font-size:.62rem;color:var(--blue);text-decoration:none;opacity:.8}
.lici-link:hover{opacity:1}
/* TICKER */
.ticker-band{position:relative;z-index:10;flex-shrink:0;background:rgba(6,9,16,.97);border-top:1px solid var(--border)}
.ticker-band::before,.ticker-band::after{content:'';position:absolute;top:0;bottom:0;width:50px;z-index:2;pointer-events:none}
.ticker-band::before{left:0;background:linear-gradient(90deg,rgba(6,9,16,.97),transparent)}
.ticker-band::after{right:0;background:linear-gradient(270deg,rgba(6,9,16,.97),transparent)}
.ticker-top{height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--blue),transparent)}
.ticker-inner{display:flex;align-items:center}
.ticker-left{display:flex;align-items:center;gap:.9rem;padding:.6rem 1rem;border-right:1px solid var(--border);flex-shrink:0}
.ticker-tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.3rem}
.clock{font-family:var(--mono);font-size:1.1rem;font-weight:600;color:var(--text);letter-spacing:.08em}
.ticker-track{overflow:hidden;flex:1}
.ticker-scroll{display:flex;white-space:nowrap;animation:scroll-left 120s linear infinite;width:max-content}
.ticker-scroll:hover{animation-play-state:paused}
@keyframes scroll-left{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-right:1px solid var(--border)}
.t-sym{font-family:var(--mono);font-size:1.1rem;font-weight:600;color:var(--text)}
.t-px{font-family:var(--mono);font-size:1.1rem;font-weight:500}
.t-pct{font-family:var(--mono);font-size:.9rem}
.t-up{color:var(--accent)}.t-dn{color:var(--red)}.t-flat{color:var(--muted)}
/* LICI */
.lici-dates{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);flex:1}
.lici-cell{background:var(--panel);padding:.7rem .9rem;display:flex;align-items:center;justify-content:center}
.lici-val{font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--amber);line-height:1;text-align:center}
.lici-cell.liq .lici-val{color:var(--muted);font-size:1.2rem}
.lici-header{display:flex;align-items:center;padding:.45rem .9rem;border-bottom:1px solid var(--border);background:var(--panel2);flex-shrink:0}
.lici-title{font-family:var(--mono);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.lici-type{font-family:var(--mono);font-size:.52rem;padding:.08rem .35rem;border-radius:3px}
.lt-fija{background:rgba(0,200,150,.1);color:var(--accent);border:1px solid rgba(0,200,150,.2)}
.lt-cer{background:rgba(61,142,240,.1);color:var(--blue);border:1px solid rgba(61,142,240,.2)}
.lt-tamar{background:rgba(240,160,61,.1);color:var(--amber);border:1px solid rgba(240,160,61,.2)}
.lt-link{background:rgba(224,82,82,.1);color:var(--red);border:1px solid rgba(224,82,82,.2)}
.lt-usd{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
/* SCALING */
@media screen and (min-width:1600px){html{font-size:18px}.rate-val{font-size:2.3rem!important}.chart-svg{height:52px!important}}
@media screen and (min-width:2400px){html{font-size:24px}.rate-val{font-size:3rem!important}.chart-svg{height:70px!important}.bond-table td{font-size:1.2rem!important}.pf-table td{font-size:1.1rem!important}.db-table td{font-size:1.1rem!important}}
</style>
</head>
<body>
<div class="main">

  <!-- MEP -->
  <div class="card" style="animation-delay:.04s">
    <div class="rate-wrap">
      <div class="rate-name">💱 Dólar MEP</div>
      <div class="rate-val-row"><div class="rate-val green" id="mep-val">—</div><div class="rate-chg" id="mep-chg"></div></div>
    </div>
    <div class="chart-wrap"><svg class="chart-svg" id="chart-mep" viewBox="0 0 300 44" preserveAspectRatio="none"></svg></div>
  </div>

  <!-- CCL -->
  <div class="card" style="animation-delay:.07s">
    <div class="rate-wrap">
      <div class="rate-name">💵 Dólar CCL</div>
      <div class="rate-val-row"><div class="rate-val blue" id="ccl-val">—</div><div class="rate-chg" id="ccl-chg"></div></div>
    </div>
    <div class="chart-wrap"><svg class="chart-svg" id="chart-ccl" viewBox="0 0 300 44" preserveAspectRatio="none"></svg></div>
  </div>

  <!-- TAMAR -->
  <div class="card" style="animation-delay:.10s">
    <div class="rate-wrap">
      <div class="rate-name">📊 Tasa TAMAR</div>
      <div class="rate-val-row"><div class="rate-val amber" id="tamar-val">—</div><div class="rate-chg" id="tamar-chg"></div></div>
      <div class="rate-date" id="tamar-date">—</div>
    </div>
    <div class="chart-wrap"><svg class="chart-svg" id="chart-tamar" viewBox="0 0 300 44" preserveAspectRatio="none"></svg></div>
  </div>

  <!-- LICI MECON -->
  <div class="card card-lici" style="animation-delay:.13s">
    <div class="lici-header" style="justify-content:space-between"><div class="lici-title">📋 Lici MECON</div><div id="lici-estado"></div></div>
    <div class="lici-dates">
      <div class="lici-cell"><div class="lici-val" id="lici-recepcion">—</div></div>
      <div class="lici-cell liq"><div class="lici-val" id="lici-liquidacion">—</div></div>
    </div>
    <div class="lici-instruments" id="lici-instruments"></div>
    <div class="lici-bottom">
      <span class="lici-countdown" id="lici-countdown"></span>
      <a class="lici-link" id="lici-link" href="#" target="_blank">ver noticia</a>
    </div>
  </div>

  <!-- FCI — col 5 span 3 filas -->
  <div class="card card-fci" style="animation-delay:.16s">
    <div class="section-label">💼 FCI Mercado Dinero · top 5 <span id="fci-ts" style="opacity:.5;font-size:.8em"></span></div>
    <div class="fci-wrap">
      <table class="fci-table" id="tbl-fci"></table>
    </div>
  </div>

  <!-- TASA FIJA -->
  <div class="card card-tf" style="animation-delay:.19s">
    <div class="bond-label"><span class="live-dot"></span>📈 Tasa Fija</div>
    <div class="bond-wrap"><table class="bond-table" id="tbl-tasafija"></table></div>
  </div>

  <!-- CER -->
  <div class="card card-cer" style="animation-delay:.22s">
    <div class="bond-label"><span class="live-dot"></span>📊 CER</div>
    <div class="bond-wrap"><table class="bond-table" id="tbl-cer"></table></div>
  </div>

  <!-- HARD DÓLAR -->
  <div class="card card-hd" style="animation-delay:.25s">
    <div class="bond-label"><span class="live-dot"></span>💵 Hard Dólar</div>
    <div class="bond-wrap"><table class="bond-table" id="tbl-hardusd"></table></div>
  </div>

  <!-- PLAZO FIJO -->
  <div class="card card-pf" style="animation-delay:.28s">
    <div class="section-label">💰 Plazo Fijo Web · no clientes · TNA 30 días <span id="pf-ts" style="opacity:.5;font-size:.8em"></span></div>
    <div class="pf-wrap"><table class="pf-table" id="tbl-pf"></table></div>
  </div>

  <!-- DOLAR BANCOS -->
  <div class="card card-db" style="animation-delay:.31s">
    <div class="section-label">🏦 Dólar Bancos · precio vendedor <span id="db-ts" style="opacity:.5;font-size:.8em"></span></div>
    <div class="db-wrap"><table class="db-table" id="tbl-db"></table></div>
  </div>

</div>

<!-- TICKER -->
<div class="ticker-band">
  <div class="ticker-top"></div>
  <div class="ticker-inner">
    <div class="ticker-left">
      <div class="ticker-tag"><span class="live-dot"></span>MERVAL</div>
      <div class="clock" id="clock">—</div>
    </div>
    <div class="ticker-track"><div class="ticker-scroll" id="ticker-scroll"></div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
function fmt2(v){return v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtP(v){return fmt2(v)+'%'}
function rnd(v,s=.003){return +(v*(1+(Math.random()-.5)*s)).toFixed(2)}
function genHist(base,n=30,vol=.007){const a=[base];for(let i=1;i<n;i++)a.push(+(a[i-1]*(1+(Math.random()-.5)*vol)).toFixed(2));return a}

const CSV_BONDS='https://docs.google.com/spreadsheets/d/e/2PACX-1vTDDCPaFWrl0LmClbajiHvYkeqbpczciXXnQV8VhWJ2QfMEhHo0tQGHpQFdN1UtFmGO--i2__OnSF8I/pub?gid=0&single=true&output=csv';
const CSV_FLUJOS='https://docs.google.com/spreadsheets/d/e/2PACX-1vSUp-XJ7rx8hw0j_Rqy7RHrqCBwqwUxgH_BZQ6RmSY2sfXNHd7Yvb2vlLCYabemODWaCLdBoQ2kxCTW/pub?gid=0&single=true&output=csv';
const API_STOCKS='/api/stocks',API_BONDS='/api/bonds',API_TAMAR='/api/tamar',API_PF='/api/bcra-pf',API_DB='/api/dolar-bancos',API_LICI='/api/lici',API_HISTORICO='/api/historico';
const API_FCI_ULTIMO='https://api.argentinadatos.com/v1/finanzas/fci/mercadoDinero/ultimo';
const API_FCI_PENULTIMO='https://api.argentinadatos.com/v1/finanzas/fci/mercadoDinero/penultimo';

function parseCSV(text){const lines=text.trim().split('\n');const headers=lines[0].split(',').map(h=>h.trim().replace(/\r/g,''));return lines.slice(1).map(line=>{const vals=line.split(',').map(v=>v.trim().replace(/\r/g,''));const obj={};headers.forEach((h,i)=>obj[h]=vals[i]||'');return obj})}
function calcFijaCer(row,precio){const vpv=parseFloat(row.VPV)||0,plazo=parseFloat(row.Plazo)||1;if(!precio||!vpv)return{tna:null,tir:null};const tna=((vpv-precio)/precio/plazo*365)*100,tir=(Math.pow(vpv/precio,365/plazo)-1)*100;return{tna:+tna.toFixed(2),tir:+tir.toFixed(2)}}
function calcHardUsd(ticker,precio,flujos){const today=new Date();const flows=flujos.filter(f=>f.Ticker===ticker&&new Date(f.Fecha)>today).map(f=>({t:(new Date(f.Fecha)-today)/(365.25*86400000),cf:parseFloat(f.Flujo)||0})).filter(f=>f.cf>0);if(!flows.length||!precio)return{tir:null,md:null};let r=0.10;for(let i=0;i<50;i++){let pv=0,dpv=0;flows.forEach(({t,cf})=>{const disc=cf/Math.pow(1+r,t);pv+=disc;dpv-=t*disc/(1+r)});const f=pv-precio,df=dpv;if(Math.abs(df)<1e-12)break;const nr=r-f/df;if(Math.abs(nr-r)<1e-8){r=nr;break}r=nr}let sumPV=0,sumWt=0;flows.forEach(({t,cf})=>{const pv=cf/Math.pow(1+r,t);sumPV+=pv;sumWt+=t*pv});return{tir:+(r*100).toFixed(2),md:+(sumWt/sumPV/(1+r)).toFixed(2)}}

function buildBondData(){bonds.tasafija=[];bonds.cer=[];bonds.hardusd=[];csvBonds.forEach(row=>{const ticker=(row.Ticker||'').trim(),tipo=(row.Tipo||'').trim(),vpv=parseFloat(row.VPV)||0;const lp=livePrices[ticker]||livePrices[ticker.toUpperCase()]||null;const precio=lp||vpv;if(!ticker||!precio)return;const pct=livePctChange[ticker]??livePctChange[ticker.toUpperCase()]??0;const plazo=(row.Plazo||'').trim();if(tipo==='Tasa Fija'){const{tna,tir}=calcFijaCer(row,precio);bonds.tasafija.push({t:ticker,p:precio,pct,tna,tir,plazo,_plazoNum:parseFloat(row.Plazo)||0})}else if(tipo==='CER'){const{tna,tir}=calcFijaCer(row,precio);bonds.cer.push({t:ticker,p:precio,pct,tna,tir,plazo,_plazoNum:parseFloat(row.Plazo)||0})}else if(tipo==='Hard Dolar'){const{tir,md}=calcHardUsd(ticker,precio,csvFlujos);bonds.hardusd.push({t:ticker,p:precio,pct,tir,md,plazo,_mdNum:parseFloat(md)||0})}});bonds.tasafija.sort((a,b)=>a._plazoNum-b._plazoNum);bonds.cer.sort((a,b)=>a._plazoNum-b._plazoNum);bonds.hardusd.sort((a,b)=>a._mdNum-b._mdNum)}

const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function fmtFechaCorta(str){if(!str)return'—';const[y,m,d]=str.split('-');return`${parseInt(d)} ${MESES[parseInt(m)-1]}`}

async function fetchFCI(){
  try{
    const[r1,r2]=await Promise.all([fetch(API_FCI_ULTIMO),fetch(API_FCI_PENULTIMO)]);
    const ultimo=await r1.json();
    const penultimo=await r2.json();
    const conDatos=ultimo.filter(f=>f.fecha&&f.vcp&&f.patrimonio);
    const top5=conDatos.sort((a,b)=>b.patrimonio-a.patrimonio).slice(0,5);
    const mapPen={};
    penultimo.forEach(f=>{if(f.vcp&&f.fecha)mapPen[f.fondo]=f});
    const rows=top5.map(f=>{
      const pen=mapPen[f.fondo];
      if(!pen)return{fondo:f.fondo,tna:null,fecha:f.fecha};
      const dias=(new Date(f.fecha)-new Date(pen.fecha))/86400000;
      const tna=dias>0?((f.vcp-pen.vcp)/pen.vcp/dias*365*100):null;
      return{fondo:f.fondo,tna,fecha:f.fecha};
    });
    renderFCI(rows);
    const tsEl=$('fci-ts');
    if(tsEl&&top5[0]?.fecha)tsEl.textContent='· '+fmtFechaCorta(top5[0].fecha);
  }catch(e){console.warn('FCI',e)}
}

function renderFCI(rows){
  const el=$('tbl-fci');if(!el)return;
  el.innerHTML=`<thead><tr><th>Fondo</th><th style="text-align:right">TNA</th><th style="text-align:right">Fecha</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="fci-name">${r.fondo}</td><td class="fci-tna">${r.tna!==null?r.tna.toFixed(2)+'%':'—'}</td><td class="fci-fecha">${fmtFechaCorta(r.fecha)}</td></tr>`).join('')}</tbody>`;
}

async function fetchLici(){
  try{
    const r=await fetch(API_LICI);
    const data=await r.json();
    const lici=data.data;
    const recEl=document.getElementById('lici-recepcion');
    const liqEl=document.getElementById('lici-liquidacion');
    const badgeEl=document.getElementById('lici-estado');
    const instrEl=document.getElementById('lici-instruments');
    const cdEl=document.getElementById('lici-countdown');
    const linkEl=document.getElementById('lici-link');
    if(!lici){
      if(recEl)recEl.textContent='—';
      if(liqEl)liqEl.textContent='—';
      if(badgeEl)badgeEl.innerHTML='';
      if(instrEl)instrEl.innerHTML='';
      if(cdEl)cdEl.textContent='';
      return;
    }
    if(recEl)recEl.textContent=lici.recepcion||'—';
    if(liqEl)liqEl.textContent=lici.liquidacion||'—';
    if(badgeEl){
      const cfg={
        activa:{txt:'ACTIVA',bg:'rgba(0,200,150,.15)',color:'var(--accent)',border:'rgba(0,200,150,.3)',dot:'●'},
        proxima:{txt:'PROXIMA',bg:'rgba(240,160,61,.15)',color:'var(--amber)',border:'rgba(240,160,61,.3)',dot:'⏳'},
        cerrada:{txt:'CERRADA',bg:'rgba(61,80,112,.2)',color:'var(--muted)',border:'rgba(61,80,112,.3)',dot:'✓'}
      };
      const s=cfg[lici.estado]||cfg.cerrada;
      badgeEl.innerHTML='<span style="font-family:var(--mono);font-size:.55rem;font-weight:600;letter-spacing:.08em;padding:.15rem .5rem;border-radius:3px;background:'+s.bg+';color:'+s.color+';border:1px solid '+s.border+'">'+s.dot+' '+s.txt+'</span>';
    }
    if(instrEl&&lici.instrumentos&&lici.instrumentos.length){
      instrEl.innerHTML=lici.instrumentos.map(function(inst){
        return '<span class="lici-type '+inst.type+'" style="font-size:.6rem;padding:.1rem .4rem;border-radius:3px">'+inst.label+'</span>';
      }).join('');
    }
    if(cdEl&&lici.recepcionISO){
      const recepClose=new Date(lici.recepcionISO);
      recepClose.setHours(15,0,0,0);
      const now=new Date();
      const diff=recepClose-now;
      if(diff>0){
        const h=Math.floor(diff/3600000);
        const m=Math.floor((diff%3600000)/60000);
        cdEl.textContent='Cierra en '+h+'h '+m+'m';
        cdEl.style.color='var(--accent)';
      } else {
        const ago=Math.abs(diff);
        const d=Math.floor(ago/86400000);
        const h=Math.floor((ago%86400000)/3600000);
        cdEl.textContent='Cerro hace '+(d>0?d+'d ':'')+h+'h';
        cdEl.style.color='var(--muted)';
      }
    }
    if(linkEl&&lici.url){
      linkEl.href=lici.url;
      linkEl.style.display='block';
    } else if(linkEl){
      linkEl.style.display='none';
    }
  }catch(e){console.warn('Lici',e)}
}

function drawChart(id,data,color){const svg=$(id);if(!svg)return;svg.innerHTML='';const clean=data.map(v=>parseFloat(v)).filter(v=>!isNaN(v)&&isFinite(v));if(clean.length<2)return;const W=300,H=44,p={t:2,b:2,l:1,r:1};const mn=Math.min(...clean)*.999,mx=Math.max(...clean)*1.001;const x=i=>p.l+(i/(clean.length-1))*(W-p.l-p.r);const y=v=>p.t+(1-(v-mn)/(mx-mn))*(H-p.t-p.b);const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');const g=document.createElementNS('http://www.w3.org/2000/svg','linearGradient');g.setAttribute('id',`g${id}`);g.setAttribute('x1','0');g.setAttribute('y1','0');g.setAttribute('x2','0');g.setAttribute('y2','1');[[0,.2],[1,0]].forEach(([o,op])=>{const s=document.createElementNS('http://www.w3.org/2000/svg','stop');s.setAttribute('offset',`${o*100}%`);s.setAttribute('stop-color',color);s.setAttribute('stop-opacity',op);g.appendChild(s)});defs.appendChild(g);svg.appendChild(defs);let aD=`M${x(0)},${H-p.b} L${x(0)},${y(clean[0])}`;clean.forEach((v,i)=>{aD+=` L${x(i)},${y(v)}`});aD+=` L${x(clean.length-1)},${H-p.b} Z`;const area=document.createElementNS('http://www.w3.org/2000/svg','path');area.setAttribute('d',aD);area.setAttribute('fill',`url(#g${id})`);svg.appendChild(area);let lD=`M${x(0)},${y(clean[0])}`;clean.forEach((v,i)=>{if(i>0)lD+=` L${x(i)},${y(v)}`});const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',lD);line.setAttribute('fill','none');line.setAttribute('stroke',color);line.setAttribute('stroke-width','1.5');line.setAttribute('stroke-linejoin','round');svg.appendChild(line);const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',x(clean.length-1));dot.setAttribute('cy',y(clean[clean.length-1]));dot.setAttribute('r','2.5');dot.setAttribute('fill',color);svg.appendChild(dot)}

function renderRate(valId,chgId,cur,prev,isRate=false){const el=$(valId);if(!el)return;el.textContent=isRate?fmtP(cur):`$${fmt2(cur)}`;const chg=$(chgId);if(!chg)return;const pct=(((cur-prev)/prev)*100).toFixed(2);const up=cur>prev;const arrow=cur>prev?'▲':cur<prev?'▼':'—';if(isRate){const bps=Math.round((cur-prev)*100);const sign=bps>0?'+':'';chg.innerHTML=`<span class="${up?'chg-up':'chg-down'}">${arrow} ${Math.abs(pct)}% <span style="font-size:.75em;opacity:.75">${sign}${bps}bps</span></span>`}else{chg.innerHTML=`<span class="${up?'chg-up':'chg-down'}">${arrow} ${Math.abs(pct)}%</span>`}}

function renderPF(){
  const sorted=[...PF_BANKS].sort((a,b)=>b.tna-a.tna);
  const uniq=[...new Set(sorted.map(x=>x.tna))].sort((a,b)=>b-a);
  const denseRank=tna=>uniq.indexOf(tna)+1;
  const mer=sorted.find(x=>x.mer);
  const merPos=mer?denseRank(mer.tna):null;
  $('tbl-pf').innerHTML=`<thead><tr><th>#</th><th>Banco</th><th>TNA</th><th>Ranking</th></tr></thead><tbody>${sorted.map(b=>{const pos=denseRank(b.tna);return`<tr class="${b.mer?'row-mer':''}"><td class="pf-pos ${pos===1?'p1':''}">#${pos}</td><td class="${b.mer?'pf-bank':''}">${b.name}</td><td class="pf-tna ${pos===1?'best':''}">${fmtP(b.tna)}</td><td style="font-family:var(--mono);font-size:.75rem;text-align:right;color:var(--muted)">${b.mer?`<span class="rank-tag">▲ ${merPos}° / ${uniq.length}</span>`:''}</td></tr>`}).join('')}</tbody>`;
}

<div class="theme-btn" id="theme-btn" title="Tema">&#9881;</div>
<div class="theme-dropdown" id="theme-dropdown">
  <div class="theme-opt active" data-t="default">Dark (actual)</div>
  <div class="theme-opt" data-t="bloomberg">Bloomberg</div>
  <div class="theme-opt" data-t="reuters">Reuters</div>
  <div class="theme-opt" data-t="meridian">Meridian</div>
</div>

<script>
if('serviceWorker' in navigator){
  // Theme selector
(function(){
  var btn=document.getElementById('theme-btn');
  var dd=document.getElementById('theme-dropdown');
  var opts=dd.querySelectorAll('.theme-opt');
  var saved=localStorage.getItem('theme')||'default';
  if(saved!=='default')document.documentElement.setAttribute('data-theme',saved);
  opts.forEach(function(o){
    if(o.getAttribute('data-t')===saved)o.classList.add('active');
    else o.classList.remove('active');
  });
  btn.addEventListener('click',function(e){e.stopPropagation();dd.classList.toggle('open')});
  document.addEventListener('click',function(){dd.classList.remove('open')});
  opts.forEach(function(o){
    o.addEventListener('click',function(){
      var t=o.getAttribute('data-t');
      if(t==='default')document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme',t);
      localStorage.setItem('theme',t);
      opts.forEach(function(x){x.classList.remove('active')});
      o.classList.add('active');
      dd.classList.remove('open');
      drawChart('chart-mep',mepHist,'#00c896');
      drawChart('chart-ccl',cclHist,'#3d8ef0');
      drawChart('chart-tamar',tamarHist,'#f0a03d');
    });
  });
})();
navigator.serviceWorker.register('/api/sw').then(()=>console.log('SW registered'));
}
</script>
</body>
